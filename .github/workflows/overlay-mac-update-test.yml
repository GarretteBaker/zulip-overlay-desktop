name: Overlay macOS update test

# Performs a real self-update on a Mac: builds the app twice as versions
# 0.0.1 and 0.0.2, "installs" 0.0.1, serves 0.0.2 from this machine, starts
# 0.0.1 and waits for it to replace itself with 0.0.2 and reopen.
# Nothing is published.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --run build
      - name: Package versions 0.0.1 and 0.0.2
        run: |
          arch="$(node -p process.arch)"
          for version in 0.0.1 0.0.2; do
            pnpm exec electron-builder --mac zip "--$arch" -c.mac.identity=- \
              -c.extraMetadata.version="$version" -c.directories.output="built/$version" --publish=never
          done
          node tools/overlay-mac-manifest.mjs built/0.0.2 0.0.2
          cat built/0.0.2/mac-update.json
      - name: Install 0.0.1 and serve 0.0.2
        run: |
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto -x -k built/0.0.1/Iliad-Overlay-0.0.1-*.zip "$RUNNER_TEMP/Applications"
          ls "$RUNNER_TEMP/Applications"
          (cd built/0.0.2 && nohup python3 -m http.server 8899 --bind 127.0.0.1 >"$RUNNER_TEMP/http.log" 2>&1 &)
      - name: Start 0.0.1 and wait for it to become 0.0.2
        run: |
          app="$RUNNER_TEMP/Applications/Iliad Overlay.app"
          version() { defaults read "$app/Contents/Info" CFBundleShortVersionString; }
          echo "installed: $(version)"
          ILIAD_OVERLAY_UPDATE_URL=http://127.0.0.1:8899 ILIAD_OVERLAY_UPDATE_AUTOINSTALL=1 \
            "$app/Contents/MacOS/Iliad Overlay" --user-data-dir="$RUNNER_TEMP/profile" >"$RUNNER_TEMP/app.log" 2>&1 &
          first=$!
          for _ in $(seq 60); do
            sleep 3
            if [ "$(version)" = 0.0.2 ] && ! kill -0 "$first" 2>/dev/null && pgrep -f "$app/Contents/MacOS/Iliad Overlay" >/dev/null; then
              echo "updated to $(version); the first process has quit and the new app is running"
              codesign --verify --deep --strict "$app"
              exit 0
            fi
          done
          echo "::error::no update within 3 minutes (installed version: $(version))"
          exit 1
      - name: Logs
        if: always()
        run: |
          echo "== http"; cat "$RUNNER_TEMP/http.log" || true
          echo "== app"; tail -50 "$RUNNER_TEMP/app.log" || true
          echo "== updates.log"; find "$RUNNER_TEMP/profile" "$HOME/Library/Application Support/Iliad Overlay" -name updates.log -exec tail -30 {} \; 2>/dev/null || true
          pgrep -fl "Iliad Overlay" || true
