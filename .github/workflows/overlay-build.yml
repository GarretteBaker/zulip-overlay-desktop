name: Overlay build

# Builds the Iliad Overlay installers for Linux, macOS and Windows and keeps
# them as workflow artifacts; a tag also publishes them as a GitHub release,
# which installed Windows and Linux AppImage copies then update to.
# Nothing is signed with
# a paid certificate: macOS gets an ad-hoc signature (Apple-silicon Macs
# refuse to run unsigned code at all), so users still approve the app once in
# System Settings; Windows shows a SmartScreen warning.
#
# Run it from the Actions tab, or push a tag named overlay-v<version>.

on:
  workflow_dispatch:
  push:
    tags: ["overlay-v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: overlay-build-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: --linux
          - os: macos-latest
            flags: --mac -c.mac.identity=-
          - os: windows-latest
            flags: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --run build
      - name: Package
        env:
          # Do not look for a Developer ID or a Windows certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.flags }} --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: iliad-overlay-${{ runner.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml

  # On a tag, gather the installers into a GitHub release. It must not be a
  # pre-release: installed apps update from releases/latest/download, and
  # GitHub's "latest" skips pre-releases. latest.yml (Windows) and
  # latest-linux.yml tell the updater which file to fetch; macOS has none
  # because that build cannot update itself.
  release:
    if: startsWith(github.ref, 'refs/tags/overlay-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ls -la installers
          cat >notes.md <<'NOTES'
          Unofficial Zulip desktop client for alignment-theory.zulipchat.com with votes, replies, threads and inline reactions. Alpha: expect rough edges.

          - **macOS**: not signed with an Apple Developer ID. After the first blocked launch, open System Settings → Privacy & Security and choose "Open Anyway". Apple silicon: the `arm64` file; Intel: `x64`.
          - **Windows**: SmartScreen warns about an unknown publisher; choose "More info" → "Run anyway".
          - **Linux**: make the AppImage executable and run it.

          Windows and Linux AppImage installs update themselves from here. macOS installs do not; the app shows a notice when a newer version exists.

          Votes and inline reactions work only for people on the service's list of users; everything else works for anyone in the organization.
          NOTES
          gh release create "$REF_NAME" --latest --title "Iliad Overlay ${REF_NAME#overlay-v} (alpha)" --notes-file notes.md installers/*
